# ─────────────────────────────────────────────────────────────────────────────
# BeOnEdge landing site — self-contained stack.
#
#   cp .env.example .env     # fill BEO_API_BASE + NEWUSER_SHARED_SECRET
#   docker compose up -d --build
#   → http://localhost
#
# Two containers: the Next.js site, and nginx in front of it. Plain HTTP only —
# TLS always terminates in front of this origin (the Cloudflare Tunnel in
# production, nothing at all locally), so there is no certificate here to manage
# and no certbot. On the VPS the bundled nginx is switched off entirely by
# docker-compose.override.yml, because the host's nginx already owns :80.
# ─────────────────────────────────────────────────────────────────────────────

name: boe-landing

# Applied to every long-running container. Nothing here needs to add
# capabilities or escalate privileges, so both are dropped outright.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  landing:
    build:
      context: .
    image: boe-landing:local
    container_name: boe-landing
    <<: *hardening
    # The image ships only compiled output; nothing needs to write to the
    # filesystem at runtime. /tmp is a bounded tmpfs rather than a writable
    # layer, and noexec means a dropped file there cannot be run.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      # Required. Absent values make signup throw a clear startup-style error
      # instead of silently posting nowhere — see src/lib/env.ts.
      #
      # `:?` makes compose refuse to start rather than pass an empty string,
      # which would otherwise look like a working deploy until the first signup.
      BEO_API_BASE: ${BEO_API_BASE:?set BEO_API_BASE in .env, including the /api suffix}
      NEWUSER_SHARED_SECRET: ${NEWUSER_SHARED_SECRET:?set NEWUSER_SHARED_SECRET in .env, matching the app stack}
      # Signs /pay/go links. Must match PAYMENT_START_SECRET on the app stack;
      # /pay/go refuses every request when it is absent or under 32 characters.
      PAY_REDIRECT_SECRET: ${PAY_REDIRECT_SECRET:-}
      NODE_ENV: production
      PORT: "3110"
      HOSTNAME: 0.0.0.0
    expose:
      - "3110"
    # Deliberately no `ports:`. The site is reachable only through nginx, so the
    # rate limits and security headers cannot be bypassed by hitting the Next.js
    # server directly on the host.
    networks:
      - edge

  payments:
    build:
      context: ./payment-service
    image: boe-payment-service:local
    container_name: boe-payment-service
    profiles:
      - payments
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      HOST: 0.0.0.0
      PORT: "47430"
      LOG_LEVEL: ${PAYMENTS_LOG_LEVEL:-info}
      PHONEPE_CLIENT_ID: ${PHONEPE_CLIENT_ID:-}
      PHONEPE_CLIENT_SECRET: ${PHONEPE_CLIENT_SECRET:-}
      PHONEPE_CLIENT_VERSION: ${PHONEPE_CLIENT_VERSION:-1}
      PHONEPE_MERCHANT_ID: ${PHONEPE_MERCHANT_ID:-}
      PHONEPE_CALLBACK_USERNAME: ${PHONEPE_CALLBACK_USERNAME:-}
      PHONEPE_CALLBACK_PASSWORD: ${PHONEPE_CALLBACK_PASSWORD:-}
      PHONEPE_API_TIMEOUT_MS: ${PHONEPE_API_TIMEOUT_MS:-10000}
      PAYMENT_PUBLIC_ORIGIN: ${PAYMENT_PUBLIC_ORIGIN:-}
      PAYMENT_CALLERS: ${PAYMENT_CALLERS:-}
      EVENT_DELIVERY_TIMEOUT_MS: ${EVENT_DELIVERY_TIMEOUT_MS:-10000}
      REPLAY_WINDOW_SECONDS: ${REPLAY_WINDOW_SECONDS:-300}
      MAINTENANCE_STATE: ${MAINTENANCE_STATE:-NORMAL}
    expose:
      - "47430"
    ports:
      - "127.0.0.1:47430:47430"
    networks:
      - edge

  nginx:
    image: nginx:1.27-alpine
    container_name: boe-landing-nginx
    <<: *hardening
    # The official nginx image starts as root, chowns its cache directories, then
    # drops its workers to the `nginx` user — so a blanket cap_drop makes it fail
    # to start. These four are the minimum that dance needs, added back on top of
    # the drop-all above rather than running unrestricted:
    #   CHOWN, SETUID, SETGID  — the entrypoint's chown and the privilege drop
    #   NET_BIND_SERVICE       — binding 80 and 443, which are below 1024
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    depends_on:
      landing:
        # The Dockerfile defines a HEALTHCHECK, so nginx waits for the site to
        # actually answer rather than merely for the container to exist.
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      # http-context settings (rate-limit zones, gzip, real_ip) — always mounted.
      - ./nginx/shared.conf:/etc/nginx/conf.d/00-shared.conf:ro
      # The vhost. There is only one: TLS is always terminated in front of this
      # origin, so there is no certificate here to configure and no variant to
      # choose between.
      - ./nginx/vhost.conf:/etc/nginx/conf.d/10-landing.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    networks:
      - edge

networks:
  edge:
    driver: bridge
