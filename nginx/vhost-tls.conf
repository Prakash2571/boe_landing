# ─────────────────────────────────────────────────────────────────────────────
# OPT-IN vhost — nginx terminates TLS itself with a Let's Encrypt certificate.
#
# Not active by default, because nginx refuses to start if ssl_certificate points
# at a file that does not exist yet — which is always true on a fresh clone. So
# the flow is: bring the stack up on HTTP, obtain a certificate, then switch.
#
#   1. docker compose up -d
#   2. docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#        -d beonedge.in -d www.beonedge.in --email <you> --agree-tos --no-eff-email
#   3. put NGINX_VHOST=./nginx/vhost-tls.conf in .env
#   4. docker compose up -d --force-recreate nginx
#
# ── THE ONE THING TO EDIT ───────────────────────────────────────────────────
# The domain appears in server_name and in the two certificate paths below. If
# this site ever moves, change it in all three places — a mismatch between
# server_name and the certificate is what produces a browser trust warning.
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: redirect to HTTPS, but never break renewal ────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Declared BEFORE the redirect so certbot's validation request is served
    # rather than bounced to 443. `^~` guarantees it wins over the `/` match.
    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → apex, so there is one canonical origin ────────────────────────────
# Split into its own server block rather than an `if` inside the main one: this
# lets the redirect happen before any proxying and keeps the main block free of
# host branching.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.beonedge.in;

    ssl_certificate     /etc/letsencrypt/live/beonedge.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beonedge.in/privkey.pem;
    include /etc/nginx/snippets/tls-params.conf;

    return 301 https://beonedge.in$request_uri;
}

# ── the site ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name beonedge.in;

    ssl_certificate     /etc/letsencrypt/live/beonedge.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beonedge.in/privkey.pem;
    include /etc/nginx/snippets/tls-params.conf;

    include /etc/nginx/snippets/security-headers.conf;

    # HSTS belongs only here, never on the HTTP vhost: sending it over plain HTTP
    # is meaningless, and a browser that has cached it cannot reach the site at
    # all if TLS later breaks. Start without `preload` — that list is effectively
    # permanent, so opt in only once renewal has proven itself.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/acme-challenge.conf;

    # ── the signup door ─────────────────────────────────────────────────────
    # Exact-match location, declared before `/`, so the strict limit applies to
    # signup and nothing else. Every accepted POST becomes an application for
    # admin review on the app backend.
    #
    # burst=10, not the default 0: several people signing up at once from one
    # shared IP (office or classroom NAT) must succeed, not queue or fail.
    #
    # error_page rewrites the 429 into JSON because this endpoint is consumed by
    # a fetch() client (SignupForm) that calls response.json() — nginx's
    # built-in HTML 429 page would fail to parse and surface as a generic,
    # incomprehensible failure in the form.
    location = /api/newuser {
        limit_req zone=landing_signup burst=10 nodelay;
        error_page 429 = @signup_rate_limited;
        include /etc/nginx/snippets/proxy-landing.conf;
    }

    # The shape ({ok, message}) matches what the form reads from the API, so a
    # rate-limited request renders the sentence below instead of an error state.
    location @signup_rate_limited {
        default_type application/json;
        return 429 '{"ok":false,"message":"Too many signup attempts just now. Please try again in a minute."}';
    }

    location ^~ /_next/static/ {
        include /etc/nginx/snippets/proxy-landing.conf;
        access_log off;
    }

    location / {
        limit_req zone=landing_general burst=60 nodelay;
        include /etc/nginx/snippets/proxy-landing.conf;
    }
}
