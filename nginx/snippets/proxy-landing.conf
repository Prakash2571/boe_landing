# Proxy to the Next.js container. Included by every location in both vhosts.
#
# `landing` is the compose service name, resolved on the internal network. The
# container is deliberately not published on the host, so nginx is the only way
# in and the rate limits above cannot be bypassed by hitting the app directly.

proxy_pass http://landing:3110;

proxy_http_version 1.1;
# Clearing Connection lets nginx keep the upstream connection alive, which
# matters because a single page load makes many requests to the same upstream.
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# The signup route handler calls the app backend and waits for it. If that call
# is slow, failing here before the handler can return its own 503 would replace
# a useful message with a bare gateway error.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

proxy_redirect off;
