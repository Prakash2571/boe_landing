# Let's Encrypt HTTP-01 challenge.
#
# Must stay reachable over plain HTTP forever, not just during first issuance —
# certbot re-validates on every renewal. `^~` makes this win over the catch-all
# `location /` without regex evaluation, and it is declared before any
# HTTP→HTTPS redirect so a renewal is never bounced to a port certbot is not
# asking on.
#
# The webroot is a shared volume that the certbot container writes into.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    access_log off;
}
