# Shared TLS parameters for every HTTPS server block.
#
# Kept in one snippet so the apex and the www-redirect block cannot drift apart —
# a redirect served with a weaker profile than the site it points at is a real
# downgrade surface, and it is easy to miss when the settings are duplicated.

# TLS 1.2 is retained for older Android WebViews; 1.0/1.1 are not offered.
ssl_protocols TLSv1.2 TLSv1.3;

# Let the client choose among our ciphers: on TLS 1.3 the ordering is fixed
# anyway, and modern clients pick the cipher their hardware accelerates.
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# A shared session cache across workers, so a returning visitor resumes instead
# of paying for a full handshake. Tickets are off because rotating them properly
# is operational work nobody does, and a stale ticket key weakens forward secrecy.
ssl_session_cache shared:BOE_TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling: the server fetches the revocation proof so the browser does not
# have to make its own round trip to the CA on first connect.
#
# `ssl_stapling_verify` is deliberately NOT enabled here. It requires
# ssl_trusted_certificate to point at the issuer chain, which is a per-domain
# path and so cannot live in a shared snippet — and when it is missing nginx logs
# a startup warning and silently serves no staple, which is worse than not
# claiming verification at all. Add both together in the vhost if you want it.
ssl_stapling on;
resolver 127.0.0.11 valid=60s;
resolver_timeout 5s;
