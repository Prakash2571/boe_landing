# Response headers applied to every route in both vhosts.
#
# `always` matters: without it nginx drops these on error responses, which is
# exactly when a clickjacked or sniffed page is most interesting to an attacker.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# This site has no camera, microphone, geolocation or payment UI. Denying them
# outright means a future dependency cannot quietly start asking.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# ── Content-Security-Policy ─────────────────────────────────────────────────
# img-src allows images.unsplash.com because the hero, home and about pages load
# their photography from there with plain <img> tags. Narrow that host list if
# the imagery ever moves in-repo.
#
# script-src carries 'unsafe-inline' as a deliberate, documented compromise:
# Next.js App Router injects inline bootstrap/hydration scripts, and tightening
# this properly means threading a per-request nonce through the root layout and
# into these headers. Until that is done, claiming a stricter policy here would
# just break the site. style-src is the same story for inline styles.
#
# What the policy still buys, even with inline allowed: no third-party script
# origin can execute, no <base> hijack, forms cannot post off-origin, the page
# cannot be framed, and no plugin content loads.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https://images.unsplash.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; manifest-src 'self'" always;
