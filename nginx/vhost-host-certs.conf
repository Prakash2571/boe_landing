# ─────────────────────────────────────────────────────────────────────────────
# OPT-IN vhost — TLS using certificates the HOST already manages.
#
# Use this when the box already has a working Let's Encrypt certificate and a
# certbot timer, and you are moving nginx into a container without wanting to
# reissue anything. It is the right choice for beonedge.in today: the certificate
# exists, renewal already runs, and Cloudflare fronts the site in a mode that
# requires the origin to speak HTTPS.
#
# Enable with:
#   NGINX_VHOST=./nginx/vhost-host-certs.conf
#   LETSENCRYPT_SRC=/etc/letsencrypt
#   ACME_WEBROOT_SRC=/var/www/certbot
#
# ── THE RENEWAL TRAP ────────────────────────────────────────────────────────
# The existing certificate was issued with `authenticator = nginx`, which drives
# the HOST nginx to answer the ACME challenge. Move nginx into a container and
# that authenticator has nothing to drive, so renewal fails silently until the
# certificate expires.
#
# So switching to this vhost REQUIRES also switching certbot to webroot, pointed
# at a directory this container serves. The README migration runbook does that in
# one command; the ACME location below is what makes it work.
#
# ── THE DOMAIN ──────────────────────────────────────────────────────────────
# Appears in server_name and in the two certificate paths. Change all three
# together — a mismatch is what produces a browser trust warning.
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: challenge + redirect ──────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Before the redirect, so a renewal request is answered rather than bounced.
    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → apex ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.beonedge.in;

    ssl_certificate     /etc/letsencrypt/live/beonedge.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beonedge.in/privkey.pem;
    include /etc/nginx/snippets/tls-params.conf;

    return 301 https://beonedge.in$request_uri;
}

# ── the site ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name beonedge.in;

    ssl_certificate     /etc/letsencrypt/live/beonedge.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beonedge.in/privkey.pem;
    include /etc/nginx/snippets/tls-params.conf;

    include /etc/nginx/snippets/security-headers.conf;

    # Safe to send here: Cloudflare serves visitors over HTTPS, and this origin
    # only ever answers HTTPS on this block. Deliberately without `preload` —
    # that list is effectively permanent.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/acme-challenge.conf;

    location = /api/newuser {
        limit_req zone=landing_signup burst=3 nodelay;
        include /etc/nginx/snippets/proxy-landing.conf;
    }

    location = /api/newuser/verify-email {
        limit_req zone=landing_signup burst=5 nodelay;
        include /etc/nginx/snippets/proxy-landing.conf;
    }

    location ^~ /_next/static/ {
        include /etc/nginx/snippets/proxy-landing.conf;
        access_log off;
    }

    location / {
        limit_req zone=landing_general burst=60 nodelay;
        include /etc/nginx/snippets/proxy-landing.conf;
    }
}
