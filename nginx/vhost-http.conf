# ─────────────────────────────────────────────────────────────────────────────
# DEFAULT vhost — plain HTTP, no certificate required.
#
# This is what `docker compose up -d` gives you, so a fresh clone serves the site
# immediately on http://localhost with nothing to configure. It is also the right
# config when TLS is terminated in front of this box (an AWS ALB, CloudFront, or
# any other reverse proxy that speaks HTTPS to the world and HTTP to the origin).
#
# To terminate TLS here instead, obtain a certificate and point NGINX_VHOST at
# nginx/vhost-tls.conf — see the deployment section of README.md.
#
# server_name is the catch-all `_` on purpose: it answers on localhost, on the
# instance's public DNS name and on the real domain without needing an edit.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # Keep certificate renewal working even while running HTTP-only, so switching
    # to vhost-tls.conf later is a one-line change rather than a config rewrite.
    include /etc/nginx/snippets/acme-challenge.conf;

    # ── the signup door ─────────────────────────────────────────────────────
    # Exact-match location, declared before `/`, so the strict limit applies to
    # signup and nothing else. Every accepted POST becomes an application row.
    location = /api/newuser {
        limit_req zone=landing_signup burst=3 nodelay;
        include /etc/nginx/snippets/proxy-landing.conf;
    }

    # ── build assets ────────────────────────────────────────────────────────
    # Next.js fingerprints these filenames and sets its own immutable
    # Cache-Control, so they are exempt from the request limit: a cold page load
    # legitimately fetches dozens at once.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/proxy-landing.conf;
        access_log off;
    }

    # ── everything else ─────────────────────────────────────────────────────
    location / {
        limit_req zone=landing_general burst=60 nodelay;
        include /etc/nginx/snippets/proxy-landing.conf;
    }
}
