
server {
    listen 80;
    listen [::]:80;

    server_name www.beonedge.in;

    include /etc/nginx/snippets/boe-landing-headers.conf;

    location ^~ /pay/go {
        limit_req zone=boe_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:47410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location ^~ /pay/return/ {
        limit_req zone=boe_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:47410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location ^~ /pay/start {
        limit_req zone=boe_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:47430/pay/start;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location = /payment-return {
        limit_req zone=boe_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:47430/payment-return;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location ^~ /api/v1/provider-events/phonepe/ {
        proxy_pass http://127.0.0.1:47430/api/v1/provider-events/phonepe/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_buffering off;
        access_log /var/log/nginx/boe-phonepe-callback.access.log;
    }

    location / {
        return 301 https://beonedge.in$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name beonedge.in;

    include /etc/nginx/snippets/boe-landing-headers.conf;

    access_log /var/log/nginx/boe-landing.access.log;
    error_log  /var/log/nginx/boe-landing.error.log warn;

    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    location = /api/newuser {
        limit_req zone=boe_signup burst=10 nodelay;
        error_page 429 = @signup_rate_limited;
        proxy_pass http://127.0.0.1:47410;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location @signup_rate_limited {
        default_type application/json;
        return 429 '{"ok":false,"message":"Too many signup attempts just now. Please try again in a minute."}';
    }

    location ^~ /pay/go {
        limit_req zone=boe_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:47410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location ^~ /pay/return/ {
        limit_req zone=boe_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:47410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location ^~ /pay/start {
        limit_req zone=boe_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:47430/pay/start;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location = /payment-return {
        limit_req zone=boe_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:47430/payment-return;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location ^~ /api/v1/provider-events/phonepe/ {
        proxy_pass http://127.0.0.1:47430/api/v1/provider-events/phonepe/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_buffering off;
        access_log /var/log/nginx/boe-phonepe-callback.access.log;
    }

    location /api/ {
        return 404;
    }

    location ^~ /_next/static/ {
        include /etc/nginx/snippets/boe-landing-headers.conf;
        proxy_pass http://127.0.0.1:47410;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        limit_req zone=boe_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:47410;
        proxy_set_header Connection "";
    }
}
