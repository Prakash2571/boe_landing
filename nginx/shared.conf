# ─────────────────────────────────────────────────────────────────────────────
# http-context settings, mounted to /etc/nginx/conf.d/00-shared.conf.
#
# Lives in its own file (not inside the vhost) because limit_req_zone, gzip and
# real_ip are only valid in the http context, and both vhost variants — HTTP-only
# and TLS — need them. Mounting it separately means the two vhosts stay thin and
# neither duplicates this block.
# ─────────────────────────────────────────────────────────────────────────────

# Don't advertise the nginx version to every scanner on the internet.
server_tokens off;

# ── client body ─────────────────────────────────────────────────────────────
# Everything this site accepts is a small JSON form or a GET. There is no upload
# path, so a low ceiling costs nothing and caps a trivially cheap abuse vector.
client_max_body_size 64k;
client_body_timeout 15s;
client_header_timeout 15s;

# ── real client IP ──────────────────────────────────────────────────────────
# The rate limits below key on $binary_remote_addr, so they are only meaningful
# if that is the visitor's address rather than a proxy's.
#
# beonedge.in is served through Cloudflare, so without this every request would
# arrive from a Cloudflare edge address and ALL visitors would share one rate
# limit bucket. These are Cloudflare's published ranges; keeping them enabled is
# harmless off-Cloudflare too, since a direct or localhost connection never
# matches one and real_ip simply does not fire.
#
# Refresh from https://www.cloudflare.com/ips/ when Cloudflare publishes changes.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# CF-Connecting-IP is a single address Cloudflare sets itself, so it cannot be
# spoofed by a client the way an appended X-Forwarded-For entry can.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# If this site is ever moved behind an AWS ALB/NLB instead, replace the block
# above with the load balancer's subnets and `real_ip_header X-Forwarded-For;`.

# ── rate limiting ───────────────────────────────────────────────────────────
# Keyed on the client address, so these are per-visitor here — unlike the app
# backend, where the caller is a single server and the budget is shared.
#
# General browsing is generous: a page load pulls many static assets.
limit_req_zone $binary_remote_addr zone=landing_general:10m rate=30r/s;

# Signup is not. POST /api/newuser forwards to the app backend and creates an
# application for admin review, so each accepted request has a real downstream
# cost. No human signs up ten times a minute; a script would.
limit_req_zone $binary_remote_addr zone=landing_signup:10m rate=10r/m;

# 429 is the honest answer. nginx's default 503 reads as "the site is broken".
limit_req_status 429;

# ── compression ─────────────────────────────────────────────────────────────
# Next.js serves pre-compressed nothing by default, so gzip here is what makes
# the HTML and JS payloads reasonable. Images are already compressed — including
# them would burn CPU for nothing.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;
