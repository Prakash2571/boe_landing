# ─────────────────────────────────────────────────────────────────────────────
# The vhost — plain HTTP, no certificate.
#
# The only vhost this repo ships, because it is the only shape the site is ever
# served in: something else terminates TLS in front of the origin. In production
# that is the Cloudflare Tunnel (see docker-compose.override.yml on the VPS, where
# this nginx is disabled entirely in favour of the host's); locally it is nothing
# at all, so `docker compose up -d` serves the site on http://localhost with no
# configuration.
#
# There is deliberately no TLS variant and no certbot. The origin holds no
# certificate: the tunnel carries traffic back over an outbound connection, so
# there is nothing listening publicly to present one, and an ACME HTTP-01
# challenge has no public address to answer on. Configuration for a certificate
# that cannot exist is worse than none — it reads as an option.
#
# server_name is the catch-all `_` on purpose: it answers on localhost, on the
# instance's public DNS name and on the real domain without needing an edit.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # ── the signup door ─────────────────────────────────────────────────────
    # Exact-match location, declared before `/`, so the strict limit applies to
    # signup and nothing else. Every accepted POST becomes an application for
    # admin review on the app backend.
    #
    # burst=10, not the default 0: several people signing up at once from one
    # shared IP (office or classroom NAT) must succeed, not queue or fail.
    #
    # error_page rewrites the 429 into JSON because this endpoint is consumed by
    # a fetch() client (SignupForm) that calls response.json() — nginx's
    # built-in HTML 429 page would fail to parse and surface as a generic,
    # incomprehensible failure in the form.
    location = /api/newuser {
        limit_req zone=landing_signup burst=10 nodelay;
        error_page 429 = @signup_rate_limited;
        include /etc/nginx/snippets/proxy-landing.conf;
    }

    # The shape ({ok, message}) matches what the form reads from the API, so a
    # rate-limited request renders the sentence below instead of an error state.
    location @signup_rate_limited {
        default_type application/json;
        return 429 '{"ok":false,"message":"Too many signup attempts just now. Please try again in a minute."}';
    }

    # ── build assets ────────────────────────────────────────────────────────
    # Next.js fingerprints these filenames and sets its own immutable
    # Cache-Control, so they are exempt from the request limit: a cold page load
    # legitimately fetches dozens at once.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/proxy-landing.conf;
        access_log off;
    }

    # ── everything else ─────────────────────────────────────────────────────
    location / {
        limit_req zone=landing_general burst=60 nodelay;
        include /etc/nginx/snippets/proxy-landing.conf;
    }
}
